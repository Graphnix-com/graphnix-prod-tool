# The only container that publishes ports. Runs once per server, from /srv/graphnix/caddy,
# and routes each hostname to its environment over the shared graphnix-edge network.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]

networks:
  edge:
    external: true
    name: graphnix-edge

volumes:
  caddy-data: {}
  caddy-config: {}
