{% extends "base.html" %}
{% block title %}Sign in · Graphnix tracker{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>Sign in</h1>
  <p class="sub">Microsoft 365 sign-in arrives in week 4.</p>
  <form method="post">
    {% csrf_token %}
    {% include "partials/form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <p><button type="submit" class="primary">Sign in</button></p>
  </form>
</div>
{% endblock %}
