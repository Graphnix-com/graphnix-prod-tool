<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Graphnix tracker{% endblock %}</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; color: #1d1d1f; background: #f6f6f4; }
    header { display: flex; justify-content: space-between; align-items: center;
             padding: 12px 24px; background: #fff; border-bottom: 1px solid #ddd; }
    header .env { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #eee; }
    header .env.staging { background: #fde68a; }
    main { max-width: 960px; margin: 24px auto; padding: 0 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; }
    .status { font-weight: 600; text-transform: uppercase; font-size: 12px; }
    .ok { color: #15803d; } .warn { color: #b45309; } .fail { color: #b91c1c; }
    footer { max-width: 960px; margin: 0 auto 24px; padding: 0 24px; color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <strong>Graphnix tracker</strong>
    <span>
      <span class="env {{ APP_ENV }}">{{ APP_ENV }}</span>
      {% if user.is_authenticated %}
        &nbsp;{{ user.get_short_name }}
        <form method="post" action="{% url 'admin:logout' %}" style="display:inline">
          {% csrf_token %}<button type="submit">Sign out</button>
        </form>
      {% endif %}
    </span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Version {{ GIT_SHA }}</footer>
</body>
</html>
