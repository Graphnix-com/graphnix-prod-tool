{% extends "base.html" %}
{% block title %}Edit {{ job.display_number }}{% endblock %}
{% block content %}
<p class="muted" style="margin:0"><a href="{% url 'jobs:detail' job.pk %}?tab=details">{{ job.display_number }}</a> /</p>
<h1>Edit Job Details</h1>
<form method="post" class="card">
  {% csrf_token %}
  {% include "partials/form_fields.html" %}
  <p><button type="submit" class="primary">Save</button> <a href="{% url 'jobs:detail' job.pk %}?tab=details">Cancel</a></p>
</form>
{% endblock %}
